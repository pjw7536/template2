apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-console
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: tailwind-portal
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: minio-console@file
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /minio-console
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  name: console
