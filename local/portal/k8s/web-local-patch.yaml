apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  template:
    spec:
      containers:
        - name: web
          imagePullPolicy: Never
          env:
            - name: VITE_BACKEND_URL
              value: /
            - name: BACKEND_API_URL
              value: http://api:8000
            - name: VITE_MINIO_ENDPOINT
              value: http://localhost:8080/minio
            - name: VITE_SITE_URL
              value: http://localhost:8080
