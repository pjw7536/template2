apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal
  labels:
    app.kubernetes.io/name: portal
    app.kubernetes.io/part-of: tailwind-portal
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: edge-nginx
                port:
                  name: http
