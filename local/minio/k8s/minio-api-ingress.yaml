apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-api
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: shared-storage
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: minio-api@file
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /minio
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  name: api
