apiVersion: v1
kind: PersistentVolume
metadata:
  name: tailwind-local-minio
spec:
  capacity: {storage: 10Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  claimRef: {namespace: tailwind-local, name: minio-data}
  local: {path: /data/local-runtime/minio}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [tailwind-local-worker]
