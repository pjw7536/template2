# 로컬 PC에서 전체 앱을 함께 실행하기 위한 자원·동시성 설정입니다.
config:
  core:
    parallelism: '4'
    max_active_tasks_per_dag: '2'
    max_active_runs_per_dag: '1'
    dags_are_paused_at_creation: 'True'
  api:
    workers: '2'
scheduler:
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: '2', memory: 2Gi}
  # LocalExecutor도 task 실행 시 DAG 원본을 읽습니다.
  extraVolumes:
    - name: local-platform-dag
      configMap:
        name: local-platform-dag
  extraVolumeMounts:
    - name: local-platform-dag
      mountPath: /opt/airflow/dags/local_platform_smoke.py
      subPath: local_platform_smoke.py
      readOnly: true
dagProcessor:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: '1', memory: 1Gi}
  # 독립 DAG processor가 로컬 검증 DAG를 읽습니다.
  extraVolumes:
    - name: local-platform-dag
      configMap:
        name: local-platform-dag
  extraVolumeMounts:
    - name: local-platform-dag
      mountPath: /opt/airflow/dags/local_platform_smoke.py
      subPath: local_platform_smoke.py
      readOnly: true
apiServer:
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: '1', memory: 1536Mi}
