apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: local-traefik, namespace: airflow}
rules:
  - apiGroups: ['']
    resources: [services, endpoints, secrets]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
  - apiGroups: ['']
    resources: [events]
    verbs: [create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: local-traefik, namespace: airflow}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: local-traefik}
subjects:
  - {kind: ServiceAccount, name: traefik, namespace: tailwind-local}
