# 로컬 Traefik의 localhost 하위 경로 처리입니다. 운영 Ingress는 참조하지 않습니다.
http:
  middlewares:
    minio-api:
      chain:
        middlewares:
          - minio-api-slash
          - minio-api-strip
    minio-api-slash:
      redirectRegex:
        regex: '^(https?://[^/]+/minio)(\?.*)?$'
        replacement: '${1}/${2}'
        permanent: true
    minio-api-strip:
      stripPrefix:
        prefixes:
          - /minio
    minio-console:
      chain:
        middlewares:
          - minio-console-slash
          - minio-console-strip
    minio-console-slash:
      redirectRegex:
        regex: '^(https?://[^/]+/minio-console)(\?.*)?$'
        replacement: '${1}/${2}'
        permanent: true
    minio-console-strip:
      stripPrefix:
        prefixes:
          - /minio-console
