map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 50m;
  proxy_http_version 1.1;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  set $work_hub_enabled "${WORK_HUB_ENABLED}";

  location = /_grist_forward_auth {
    internal;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $portal_verify_url "${PORTAL_VERIFY_URL}";
    proxy_pass $portal_verify_url;
    proxy_ssl_server_name on;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Grist-Original-URI $request_uri;
  }

  location = /auth/login {
    if ($work_hub_enabled !~* "^(1|true|yes|on)$") {
      return 503;
    }

    if ($arg_ticket = "") {
      return 302 ${PORTAL_PUBLIC_URL}/auth/grist/login?return_url=${GRIST_PUBLIC_URL}/auth/login&next=$arg_next;
    }

    auth_request /_grist_forward_auth;
    auth_request_set $portal_user_email $upstream_http_x_portal_user_email;
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $grist_upstream grist:8484;
    proxy_pass http://$grist_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-User $portal_user_email;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_redirect off;
  }

  location = /auth/logout {
    return 302 ${PORTAL_PUBLIC_URL}/api/v1/auth/logout?grist_cleared=1;
  }

  location = /boot {
    return 404;
  }

  location ^~ /boot/ {
    return 404;
  }

  # 기능 비활성화 뒤에도 기존 브라우저 session 정리를 허용합니다.
  location = /logout {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $grist_upstream grist:8484;
    proxy_pass http://$grist_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-User "";
    proxy_redirect off;
  }

  location / {
    if ($work_hub_enabled !~* "^(1|true|yes|on)$") {
      return 503;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $grist_upstream grist:8484;
    proxy_pass http://$grist_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-User "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_redirect off;
  }
}

server {
  listen 8101 default_server;
  server_name _;
  set $work_hub_enabled "${WORK_HUB_ENABLED}";

  location ~ ^/v/[^/]+/widgets/installed/work-hub-grouped-view/ {
    if ($work_hub_enabled !~* "^(1|true|yes|on)$") {
      return 503;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $grist_widget_upstream grist:8485;
    proxy_pass http://$grist_widget_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_redirect off;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; font-src 'self'; frame-ancestors ${GRIST_PUBLIC_URL}; base-uri 'none'; form-action 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    return 404;
  }
}
