apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: tailwind-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: tailwind-portal
    spec:
      containers:
        - name: api
          image: portal-api:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: api-env
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/v1/health/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: api-data
              mountPath: /data
            - name: data-movement
              mountPath: /data/data_movement
            - name: l3-spider
              mountPath: /data/l3_spider/daily_anomaly
              readOnly: true
            - name: tttm-spider
              mountPath: /data/tttm_spider
              readOnly: true
            - name: pm-spider
              mountPath: /data/pm_spider
              readOnly: true
      volumes:
        - name: api-data
          emptyDir: {}
        - name: data-movement
          emptyDir: {}
        - name: l3-spider
          emptyDir: {}
        - name: tttm-spider
          emptyDir: {}
        - name: pm-spider
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: tailwind-portal
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http
