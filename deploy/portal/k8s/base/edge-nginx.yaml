apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-nginx
  labels:
    app.kubernetes.io/name: edge-nginx
    app.kubernetes.io/part-of: tailwind-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-nginx
        app.kubernetes.io/part-of: tailwind-portal
    spec:
      initContainers:
        - name: collectstatic
          image: portal-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
          args:
            - manage.py
            - collectstatic
            - --noinput
          envFrom:
            - secretRef:
                name: api-env
          volumeMounts:
            - name: staticfiles
              mountPath: /app/staticfiles
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /api/v1/health/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: staticfiles
              mountPath: /var/www/static
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: edge-nginx-config
        - name: staticfiles
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: edge-nginx
  labels:
    app.kubernetes.io/name: edge-nginx
    app.kubernetes.io/part-of: tailwind-portal
spec:
  selector:
    app.kubernetes.io/name: edge-nginx
  ports:
    - name: http
      port: 80
      targetPort: http
