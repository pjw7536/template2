# Grist는 이 proxy를 통해서만 노출하며 외부 X-Forwarded-User 입력을 신뢰하지 않습니다.
server {
    listen 8100;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $grist_upstream grist:8484;
    set $work_hub_enabled "${WORK_HUB_ENABLED}";

    client_max_body_size 50m;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location = /_grist_forward_auth {
        internal;
        proxy_pass http://api:8000/auth/grist/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host api;
        proxy_set_header X-Grist-Original-URI $request_uri;
    }

    location = /auth/login {
        if ($work_hub_enabled !~* "^(1|true|yes|on)$") {
            return 503;
        }

        if ($arg_ticket = "") {
            return 302 http://localhost/auth/grist/login?return_url=http://localhost:8100/auth/login&next=$arg_next;
        }

        auth_request /_grist_forward_auth;
        auth_request_set $portal_user_email $upstream_http_x_portal_user_email;
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;

        proxy_pass http://$grist_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User $portal_user_email;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }

    location = /auth/logout {
        return 302 http://localhost/api/v1/auth/logout?grist_cleared=1;
    }

    location = /boot {
        return 404;
    }

    location ^~ /boot/ {
        return 404;
    }

    # 기능을 끈 뒤에도 브라우저가 기존 Grist 세션을 제거할 수 있게 유지합니다.
    location = /logout {
        proxy_pass http://$grist_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User "";
        proxy_redirect off;
    }

    location / {
        if ($work_hub_enabled !~* "^(1|true|yes|on)$") {
            return 503;
        }

        proxy_pass http://$grist_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }
}

# 자체 호스팅 Grist widget은 main app과 분리된 origin에서 정적 경로만 제공합니다.
server {
    listen 8101;
    server_name _;
    set $work_hub_enabled "${WORK_HUB_ENABLED}";

    location ~ ^/v/[^/]+/widgets/installed/work-hub-grouped-view/ {
        if ($work_hub_enabled !~* "^(1|true|yes|on)$") {
            return 503;
        }

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $grist_widget_upstream grist:8485;
        proxy_pass http://$grist_widget_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_redirect off;

        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; font-src 'self'; frame-ancestors http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        return 404;
    }
}

server {
    # 1) HTTP 80 포트에서 수신 (TLS는 상단에서 80->443 리다이렉트용 블록 추가 가능)
    listen 80;

    # 2) 배포 시 실제 도메인으로 교체하세요. 여러 도메인을 지원하려면 공백으로 구분
    #    예) server_name example.com www.example.com;
    #    임시로 모든 Host 헤더를 허용하려면 _ 를 유지합니다.
    server_name _;

    # 3) 커널의 sendfile(제로-카피) 사용: 정적 파일 전송 성능 향상
    sendfile on;
    # 4) 패킷을 크게 모아서 보냄(TCP 성능 최적화)
    tcp_nopush on;
    # 5) Nagle 알고리즘 비활성화(지연 줄이기) - 상황에 따라 on/off
    tcp_nodelay on;

    # 6) MIME 타입 해시 테이블 크기(대규모 타입 정의 시 튜닝)
    types_hash_max_size 2048;

    # 7) 업로드 등 요청 바디 최대 크기 (429/413 예방)
    client_max_body_size 10m;

    # =========================
    # 백엔드 API 프록시 (/api/)
    # =========================
    location = /api/v1/assistant/turns/stream {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    location /api/ {
        # proxy_pass에 path를 지정하지 않으면 location 접두사(/api/)를 유지한 채 전달.
        # 예) 클라이언트:  /api/v1/account/...
        #     업스트림:    /api/v1/account/...
        proxy_pass http://api:8000;

        # 원본 Host/Client IP/프로토콜을 백엔드에 전달
        proxy_set_header Host $host;                       # ex) example.com
        proxy_set_header X-Real-IP $remote_addr;          # 실제 클라이언트 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # 프록시 체인
        proxy_set_header X-Forwarded-Proto $scheme;       # http 또는 https

        # 업스트림이 리다이렉트 Location 헤더를 보낼 때, 경로를 건드리지 않음
        proxy_redirect off;

    }

    # =========================
    # 인증 콜백 등 Django에 직접 전달 (/auth/)
    # =========================
    location /auth/ {
        proxy_pass http://api:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }

    # =========================
    # Airflow UI 프록시 (/airflow/)
    # =========================
    location /airflow/ {
        # Airflow는 dev 기본 실행에서 선택 서비스이므로 요청 시점에 Docker DNS로 해석합니다.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $airflow_upstream airflow-webserver:8080;
        proxy_pass http://$airflow_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        proxy_redirect off;
    }

    # =========================
    # MinIO 콘솔 프록시 (/minio/console/)
    # =========================
    location = /minio/console {
        return 301 /minio/console/;
    }

    location /minio/console/ {
        proxy_pass http://minio:9001/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /minio/console;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_redirect ~^(/.*)$ /minio/console$1;
    }

    # =========================
    # MinIO S3 API 프록시 (/minio/)
    # =========================
    location = /minio {
        return 301 /minio/;
    }

    location /minio/ {
        proxy_pass http://minio:9000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }


    # =========================
    # 정적 파일 직접 서빙 (/static/)
    # =========================
    location /static/ {
        # alias는 요청 경로의 접두사(/static/)를 실제 디렉토리로 치환
        # ex) /static/app.css -> /var/www/static/app.css
        alias /var/www/static/;

        # 정적 파일은 접근 로그 생략하여 디스크 I/O 절약
        access_log off;

        # 브라우저 캐시 30일
        expires 30d;
        # 캐시 정책 헤더 추가
        add_header Cache-Control "public";
        # (선택) 해시된 파일이면 immutable까지
        # add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # =========================
    # 프론트엔드(HMR 지원 dev 서버) 프록시 (그 외 모든 경로)
    # dev/oidc 등 HTTP 개발 스택에서 사용
    # =========================
    location / {
        # ※ 여기서는 뒤에 슬래시가 없는 proxy_pass
        #     예) /dashboard -> 업스트림에도 /dashboard로 그대로 전달
        proxy_pass http://web:3000;

        # HTTP/1.1로 업그레이드(웹소켓/HMR 등에 필요)
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # 웹소켓 업그레이드(Vite dev/HMR, 일부 앱의 실시간 기능)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 원본 클라이언트 정보 전달
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # (선택) 정적 사이트 프리렌더링 시 캐싱 정책이나 gzip 등을 추가 구성

        # (선택) SPA 라우팅을 Nginx에서 처리하려면 try_files 고려
        # try_files $uri $uri/ /index.html;
    }
}
