apiVersion: v1
kind: Namespace
metadata:
  name: airflow-node-load-test
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: airflow-node-load-test
value: -1000
globalDefault: false
preemptionPolicy: Never
description: 기존 워크로드를 선점하지 않는 노드 부하 테스트 우선순위입니다.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-node-load-test
  namespace: airflow-node-load-test
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, watch, patch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-node-load-test
  namespace: airflow-node-load-test
subjects:
  - kind: ServiceAccount
    name: airflow-scheduler
    namespace: airflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-node-load-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-node-load-image-reader
  namespace: airflow
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [airflow-scheduler]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-node-load-image-reader
  namespace: airflow
subjects:
  - kind: ServiceAccount
    name: airflow-scheduler
    namespace: airflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-node-load-image-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: airflow-node-load-test
rules:
  - apiGroups: [""]
    resources: [nodes]
    resourceNames: [khinfow01, khplanew01]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: airflow-node-load-test
subjects:
  - kind: ServiceAccount
    name: airflow-scheduler
    namespace: airflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: airflow-node-load-test
