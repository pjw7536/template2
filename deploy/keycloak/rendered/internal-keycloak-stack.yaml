  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: etch-sso
  name: keycloak
  namespace: etch-sso
spec:
  ingressClassName: traefik
  rules:
  - host: etch-sso.samsungds.net
    http:
      paths:
      - backend:
          service:
            name: keycloak
            port:
              name: http
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - etch-sso.samsungds.net
    secretName: keycloak-tls
