spec:
  clusterIP: None
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
  selector:
    app.kubernetes.io/name: keycloak-postgres
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: etch-sso
  name: traefik
  namespace: etch-sso
spec:
  ports:
  - name: web
    port: 80
    targetPort: web
  - name: websecure
    port: 443
    targetPort: websecure
  selector:
    app.kubernetes.io/name: traefik
---
apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
    app.kubernetes.io/name: keycloak-postgres
    app.kubernetes.io/part-of: etch-sso
  name: keycloak-postgres-data
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 50Gi
  local:
    path: /appdata/keycloak-postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - khplane01w09
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/name: keycloak-postgres
    app.kubernetes.io/part-of: etch-sso
  name: keycloak-postgres-data
  namespace: etch-sso
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: ""
  volumeName: keycloak-postgres-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: etch-sso
  name: keycloak
  namespace: etch-sso
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: etch-sso
    spec:
      containers:
      - args:
        - start
        - --import-realm
        env:
        - name: KC_DB
          value: postgres
        - name: KC_DB_URL
          value: jdbc:postgresql://keycloak-postgres:5432/keycloak
        - name: KC_DB_USERNAME
          value: keycloak
        - name: KCRAW_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: postgres-password
              name: keycloak-runtime
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              key: bootstrap-admin-username
              name: keycloak-runtime
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: bootstrap-admin-password
              name: keycloak-runtime
        - name: KC_HOSTNAME
          valueFrom:
            secretKeyRef:
              key: keycloak-public-url
              name: keycloak-runtime
        - name: KC_HOSTNAME_STRICT
          value: "true"
        - name: KC_HTTP_ENABLED
          value: "true"
        - name: KC_PROXY_HEADERS
          value: xforwarded
        - name: KC_HEALTH_ENABLED
          value: "true"
        - name: KC_METRICS_ENABLED
          value: "true"
        image: repository.samsungds.net/proxy-docker-quay.io/keycloak/keycloak:26.7.1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /health/live
            port: management
          periodSeconds: 10
          timeoutSeconds: 3
        name: keycloak
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9000
          name: management
        readinessProbe:
          failureThreshold: 12
          httpGet:
            path: /health/ready
            port: management
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /health/started
            port: management
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - mountPath: /opt/keycloak/data/import/etch-realm.json
          name: realm
          readOnly: true
          subPath: etch-realm.json
      initContainers:
      - command:
        - /bin/sh
        - -c
        - until pg_isready -h keycloak-postgres -U keycloak -d keycloak; do sleep
          2; done
        image: repository.samsungds.net/proxy-docker-registry-1.docker.io/postgres:16
        imagePullPolicy: IfNotPresent
        name: wait-for-postgres
      nodeSelector:
        kubernetes.io/hostname: khplane01w09
      terminationGracePeriodSeconds: 60
      volumes:
      - configMap:
          name: keycloak-realm-64gt8mf9t2
        name: realm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: etch-sso
  name: traefik
  namespace: etch-sso
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/part-of: etch-sso
    spec:
      containers:
      - args:
        - --providers.kubernetesingress=true
        - --providers.kubernetesingress.ingressclass=traefik
        - --providers.kubernetesingress.namespaces=etch-sso,headlamp
        - --entrypoints.web.address=:8000
        - --entrypoints.websecure.address=:8443
        - --entrypoints.health.address=:9000
        - --ping=true
        - --ping.entrypoint=health
        - --api.dashboard=false
        - --accesslog=true
        - --log.level=INFO
        image: repository.samsungds.net/proxy-docker-registry-1.docker.io/traefik:v3.7.1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /ping
            port: health
          initialDelaySeconds: 10
          periodSeconds: 10
        name: traefik
        ports:
        - containerPort: 8000
          hostPort: 80
          name: web
        - containerPort: 8443
          hostPort: 443
          name: websecure
        - containerPort: 9000
          name: health
        readinessProbe:
          httpGet:
            path: /ping
            port: health
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      nodeSelector:
        ingress: traefik
      serviceAccountName: traefik
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/name: keycloak-postgres
    app.kubernetes.io/part-of: etch-sso
  name: keycloak-postgres
  namespace: etch-sso
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak-postgres
  serviceName: keycloak-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-postgres
        app.kubernetes.io/part-of: etch-sso
    spec:
      containers:
      - env:
        - name: POSTGRES_DB
          value: keycloak
        - name: POSTGRES_USER
          value: keycloak
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: postgres-password
              name: keycloak-runtime
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_INITDB_ARGS
          value: --encoding=UTF8 --data-checksums
        image: repository.samsungds.net/proxy-docker-registry-1.docker.io/postgres:16
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U keycloak -d keycloak
          failureThreshold: 6
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
        name: postgres
        ports:
        - containerPort: 5432
          name: postgres
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U keycloak -d keycloak
          failureThreshold: 12
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 512Mi
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
      nodeSelector:
        kubernetes.io/hostname: khplane01w09
      terminationGracePeriodSeconds: 60
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: keycloak-postgres-data
