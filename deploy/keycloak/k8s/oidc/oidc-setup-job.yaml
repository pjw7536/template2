# 서버 기동 후 명시적으로 실행하는 설정 작업입니다.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-oidc-setup
  namespace: etch-sso
  labels:
    app.kubernetes.io/name: keycloak-oidc-setup
    app.kubernetes.io/part-of: etch-sso
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-oidc-setup
        app.kubernetes.io/part-of: etch-sso
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: khplane01w09
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak-oidc-setup
          image: repository.samsungds.net/proxy-docker-quay.io/keycloak/keycloak:26.7.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - /opt/keycloak-config/setup-oidc.sh
          env:
            - name: KEYCLOAK_ADMIN_URL
              value: http://keycloak:8080
            - name: KEYCLOAK_TARGET_REALM
              value: etch
            - name: KEYCLOAK_IDP_ALIAS
              value: oidc
            - name: KEYCLOAK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-runtime
                  key: bootstrap-admin-username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-runtime
                  key: bootstrap-admin-password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /opt/keycloak-config
              readOnly: true
            - name: work
              mountPath: /tmp
          envFrom:
            - secretRef:
                name: keycloak-oidc-settings
      volumes:
        - name: config
          configMap:
            name: keycloak-claim-mapper
        - name: work
          emptyDir: {}
