apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../k8s
# 전달 YAML은 기존 Headlamp 권한과 ingress 노드 라벨이 준비된 운영 환경용입니다.
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: traefik
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
      - op: replace
        path: /spec/template/spec/nodeSelector
        value:
          ingress: traefik
      - op: replace
        path: /spec/template/spec/containers/0/args/2
        value: --providers.kubernetesingress.namespaces=etch-sso,headlamp
