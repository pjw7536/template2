services:
  adfs:
    build:
      context: ../apps/adfs_dummy
    environment:
      DUMMY_ADFS_EMAIL: dummy.user@example.com
      DUMMY_ADFS_NAME: Dummy User
      DUMMY_ADFS_SABUN: S000001
      DUMMY_ADFS_LOGINID: dummy.user
      DUMMY_ADFS_DEPT: Development
      DUMMY_ADFS_CLIENT_ID: dummy-client
      DUMMY_ADFS_PRIVATE_KEY_PATH: /app/dummy_adfs_private.key
      # 개발 환경에서는 더미 ADFS 서버가 HTTP로 구동되므로 발급자도 동일하게 맞춘다
      DUMMY_ADFS_ISSUER: http://localhost:9102/adfs
      DUMMY_LLM_REPLY_TEMPLATE: '개발용 더미 응답입니다. 질문 "{question}" 에 대한 테스트 답변입니다.'
      DUMMY_LLM_DELAY_MS: "1200"
      DUMMY_RAG_INDEX_NAME: emails
      DUMMY_ASSISTANT_RAG_INDEX: emails
      DUMMY_MAIL_RAG_INDEX: emails
      DUMMY_RAG_PERMISSION_GROUPS: '["rag-public"]'
    ports:
      - "9102:9000"
    networks:
      shared-net:
        aliases:
          - adfs

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - ../env/minio.env
    volumes:
      - "minio_data:/data"
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      shared-net:
        aliases:
          - minio

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    env_file:
      - ../env/minio.env
    entrypoint:
      - /bin/sh
      - -c
      - |
          set -e
          until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
            sleep 1
          done
          mc mb -p local/emails || true
          mc mb -p local/profile || true
    networks:
      shared-net:
        aliases:
          - minio-init

  api:
    image: ${API_IMAGE:-tailwind-api}
    build:
      context: ../apps/api
    env_file:
      - ../env/api.common.env
      - ../env/api.dev.env
      - ../env/minio.env
    environment:
      WORK_HUB_ENABLED: ${WORK_HUB_ENABLED:-0}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-portal}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-portal-local-secret}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-portal-admin-reader}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-portal-admin-reader-local-secret}
      KEYCLOAK_MIGRATION_CLIENT_ID: ${KEYCLOAK_MIGRATION_CLIENT_ID:-portal-migration}
      KEYCLOAK_MIGRATION_CLIENT_SECRET: ${KEYCLOAK_MIGRATION_CLIENT_SECRET:-portal-migration-local-secret}
      GRIST_LOGOUT_ENABLED: ${GRIST_LOGOUT_ENABLED:-0}
      GRIST_API_URL: ${GRIST_API_URL:-http://grist:8484/o/work-hub}
      GRIST_API_KEY: ${GRIST_API_KEY:-}
      GRIST_API_KEY_FILE: ${GRIST_API_KEY_FILE:-/run/work-hub/grist_api_key}
      GRIST_PUBLIC_URL: ${GRIST_PUBLIC_URL:-http://localhost:8100}
      GRIST_ADMIN_EMAIL: ${GRIST_ADMIN_EMAIL:-dummy.user@example.com}
      GRIST_ORG: ${GRIST_ORG:-work-hub}
      GRIST_ALLOWED_LAUNCH_HOSTS: ${GRIST_ALLOWED_LAUNCH_HOSTS:-localhost}
      GRIST_WEBHOOK_CALLBACK_URL: ${GRIST_WEBHOOK_CALLBACK_URL:-http://api:8000/api/v1/work-hub/webhooks/grist}
      GRIST_WEBHOOK_SECRET: ${GRIST_WEBHOOK_SECRET:-local-work-hub-webhook-secret}
      GRIST_FORWARD_AUTH_TICKET_SECRET: ${GRIST_FORWARD_AUTH_TICKET_SECRET:-work-hub-local-forward-auth-secret-change-me}
      GRIST_FORWARD_AUTH_TICKET_MAX_AGE_SECONDS: ${GRIST_FORWARD_AUTH_TICKET_MAX_AGE_SECONDS:-30}
      GRIST_FORWARD_AUTH_LOGIN_PATH: ${GRIST_FORWARD_AUTH_LOGIN_PATH:-/auth/login}
      GRIST_CONNECT_TIMEOUT: ${GRIST_CONNECT_TIMEOUT:-3}
      GRIST_READ_TIMEOUT: ${GRIST_READ_TIMEOUT:-15}
      GRIST_DEV_USER_SDWT_PROD: ${GRIST_DEV_USER_SDWT_PROD:-DEV_ALPHA}
      WORK_HUB_ACCESS_OUTBOX_RETENTION_DAYS: ${WORK_HUB_ACCESS_OUTBOX_RETENTION_DAYS:-30}
      WORK_HUB_WEBHOOK_RECEIPT_RETENTION_DAYS: ${WORK_HUB_WEBHOOK_RECEIPT_RETENTION_DAYS:-30}
      WORK_HUB_FAILED_WEBHOOK_RECEIPT_RETENTION_DAYS: ${WORK_HUB_FAILED_WEBHOOK_RECEIPT_RETENTION_DAYS:-90}
      WORK_HUB_ACCESS_OUTBOX_PRUNE_INTERVAL_SECONDS: ${WORK_HUB_ACCESS_OUTBOX_PRUNE_INTERVAL_SECONDS:-3600}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: emails
      MINIO_REGION: us-east-1
    depends_on:
      airflow-postgres:
        condition: service_healthy
      adfs:
        condition: service_started
      keycloak:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - "../apps/api:/app"
      - "api_data:/data"
      - "${DATA_MOVEMENT_HOST_PATH:-../data/data_movement}:/data/data_movement"
      - "api_static:/app/staticfiles"
      - "${L3_SPIDER_DATA_HOST_PATH:-../data/l3_spider/daily_anomaly}:/data/l3_spider/daily_anomaly:ro"
      - "${TTTM_SPIDER_DATA_HOST_PATH:-../data/tttm_spider}:/data/tttm_spider:ro"
      - "${PM_COMPARISON_DATA_HOST_PATH:-../data/pm_spider}:/data/pm_spider:ro"
      - "${WORK_HUB_SECRET_HOST_PATH:-../data/work_hub_secrets/dev}:/run/work-hub:ro"
    ports:
      - "8000:8000"
    entrypoint:
      - /bin/sh
      - -c
      - |
          set -e
          python manage.py ensure_dev_database
          python manage.py migrate --noinput
          if [ "$${DEV_AUTO_SEED:-0}" = "1" ]; then
            python manage.py seed_dev_data --reset --prefix "$${DEV_SEED_PREFIX:-DEV}"
          fi
          python manage.py runserver 0.0.0.0:8000
    networks:
      shared-net:
        aliases:
          - api

  web:
    build:
      context: ../apps/web
    env_file:
      - ../env/web.common.env
      - ../env/web.dev.env
    environment:
      VITE_WORK_HUB_ENABLED: ${VITE_WORK_HUB_ENABLED:-0}
    depends_on:
      - api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    volumes:
      - "../apps/web:/app"
      - "web_node_modules:/app/node_modules"
    ports:
      - "3000:3000"
    networks:
      shared-net:
        aliases:
          - web

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    ports:
      - "80:80"
      - "${GRIST_PORT:-8100}:8100"
      - "${GRIST_WIDGET_PORT:-8101}:8101"
    environment:
      NGINX_ENVSUBST_FILTER: "^WORK_HUB_ENABLED$"
      WORK_HUB_ENABLED: ${WORK_HUB_ENABLED:-0}
    volumes:
      - "../deploy/nginx/default.conf:/etc/nginx/templates/default.conf.template:ro"
      - "api_static:/var/www/static:ro"
    networks:
      - shared-net

volumes:
  api_data:
  api_static:
  minio_data:
  web_node_modules:

networks:
  shared-net:
    external: true
    name: shared-net
