name: ${GRIST_COMPOSE_PROJECT_NAME:-tailwind-grist-remote}

services:
  grist:
    image: ${GRIST_IMAGE:-repository.samsungds.net/proxy-docker-registry-1.docker.io/gristlabs/grist-oss:1.7.13}
    env_file:
      - env/grist.common.env
    environment:
      APP_HOME_URL: ${GRIST_PUBLIC_URL:-http://grist.example.invalid}
      APP_UNTRUSTED_URL: ${GRIST_WIDGET_PUBLIC_URL:-http://widgets.grist.example.invalid}
      GRIST_SINGLE_ORG: ${GRIST_ORG:-work-hub}
      GRIST_IN_SERVICE: "true"
      GRIST_FORCE_LOGIN: "true"
      GRIST_DEFAULT_EMAIL: ${GRIST_ADMIN_EMAIL:-workhub-admin@example.invalid}
      GRIST_SESSION_SECRET: ${GRIST_SESSION_SECRET:-}
      GRIST_LOGIN_SYSTEM_TYPE: forward-auth
      GRIST_FORWARD_AUTH_HEADER: X-Forwarded-User
      GRIST_FORWARD_AUTH_LOGIN_PATH: /auth/login
      GRIST_FORWARD_AUTH_LOGOUT_PATH: /auth/logout
      GRIST_UNTRUSTED_PORT: "8485"
      GRIST_USER_ROOT: /grist-custom
      ALLOWED_WEBHOOK_DOMAINS: ${GRIST_ALLOWED_WEBHOOK_DOMAINS:-plane.samsungds.net}
    command:
      - /bin/sh
      - -ec
      - |
        if [ -z "$${GRIST_SESSION_SECRET:-}" ]; then
          echo "GRIST_SESSION_SECRET 설정이 필요합니다." >&2
          exit 1
        fi
        exec ./sandbox/run.sh
    volumes:
      - grist_data:/persist
      - ./deploy/grist:/grist-custom:ro
    expose:
      - "8484"
      - "8485"
    restart: unless-stopped
    networks:
      grist-remote:
        aliases:
          - grist

  grist-api-key-init:
    image: ${GRIST_IMAGE:-repository.samsungds.net/proxy-docker-registry-1.docker.io/gristlabs/grist-oss:1.7.13}
    user: "${GRIST_SECRET_UID:-1000}:${GRIST_SECRET_GID:-1000}"
    environment:
      GRIST_ADMIN_EMAIL: ${GRIST_ADMIN_EMAIL:-workhub-admin@example.invalid}
      GRIST_ORG: ${GRIST_ORG:-work-hub}
      GRIST_API_KEY_FILE: /run/work-hub/grist_api_key
    entrypoint:
      - /grist-custom/bootstrap_api_key.sh
    volumes:
      - ./deploy/grist:/grist-custom:ro
      - "${WORK_HUB_SECRET_HOST_PATH:-./data/work_hub_secrets/remote}:/run/work-hub"
    depends_on:
      grist:
        condition: service_started
    restart: "no"
    networks:
      - grist-remote

  grist-nginx:
    image: ${GRIST_NGINX_IMAGE:-repository.samsungds.net/proxy-docker-registry-1.docker.io/nginx:1.27-alpine}
    environment:
      NGINX_ENVSUBST_FILTER: "^(WORK_HUB_ENABLED|GRIST_PUBLIC_URL|PORTAL_PUBLIC_URL|PORTAL_VERIFY_URL)$"
      WORK_HUB_ENABLED: ${WORK_HUB_ENABLED:-0}
      GRIST_PUBLIC_URL: ${GRIST_PUBLIC_URL:-http://grist.example.invalid}
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:-https://plane.samsungds.net}
      PORTAL_VERIFY_URL: ${PORTAL_VERIFY_URL:-https://plane.samsungds.net/auth/grist/verify}
    volumes:
      - ./deploy/grist/nginx.remote.conf:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${GRIST_HTTP_PORT:-80}:80"
      - "${GRIST_WIDGET_PORT:-8101}:8101"
    depends_on:
      grist:
        condition: service_started
    restart: unless-stopped
    networks:
      - grist-remote

volumes:
  grist_data:
    name: ${GRIST_DATA_VOLUME:-tailwind_grist_remote_data}

networks:
  grist-remote:
    name: ${GRIST_NETWORK_NAME:-tailwind-grist-remote}
