name: Feature Guardrails

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  frontend:
    name: Frontend test, lint, build, audits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Test web
        run: npm run web:test

      - name: Lint web
        run: npm run web:lint

      - name: Build web
        run: npm run web:build

      - name: Run repository audits
        run: npm run agent:audit

      - name: Check whitespace errors
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...HEAD"
          elif [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "$BASE_SHA^{commit}"; then
            git diff --check "$BASE_SHA" HEAD
          else
            git diff-tree --check --root --no-commit-id -r HEAD
          fi

  backend:
    name: Backend test, check, migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend test image
        run: docker compose -f docker-compose.test.yml build api-test

      - name: Run backend tests
        run: docker compose -f docker-compose.test.yml run --rm api-test python manage.py test

      - name: Run Django system checks
        run: docker compose -f docker-compose.test.yml run --rm api-test python manage.py check

      - name: Check migration drift
        run: docker compose -f docker-compose.test.yml run --rm api-test python manage.py makemigrations --check --dry-run
