name: Feature Guardrails

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  tooling:
    name: Repository layout and deployment regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/tooling/package-lock.json

      - name: Check rendering tools
        run: |
          docker compose version
          kubectl version --client
          python3 --version

      - name: Install tooling dependencies
        run: make tooling-install

      - name: Run repository regression tests
        run: make tooling-test

  frontend:
    name: Frontend test, lint, build, audits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            apps/portal/web/package-lock.json
            apps/tooling/package-lock.json

      - name: Install dependencies
        run: make install

      - name: Test web
        run: make web-test

      - name: Lint web
        run: make web-lint

      - name: Build web
        run: make web-build

      - name: Run repository audits
        run: make audit

      - name: Check whitespace errors
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...HEAD"
          elif [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "$BASE_SHA^{commit}"; then
            git diff --check "$BASE_SHA" HEAD
          else
            git diff-tree --check --root --no-commit-id -r HEAD
          fi

  backend:
    name: Backend test, check, migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend test image
        run: make build-ci-api

      - name: Run backend tests
        run: make test-ci-api

      - name: Run Django system checks
        run: make check-ci-api

      - name: Check migration drift
        run: make makemigrations-ci-check
