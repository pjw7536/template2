name: tailwind-test

services:
  test-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dashboard_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dashboard_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./scripts/test/init-postgres.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    networks:
      - test-network

  api-test:
    build:
      context: ./apps/api
    env_file:
      - ./env/overlays/test/api.config.env
      - ./env/overlays/test/api.secret.env
    depends_on:
      test-postgres:
        condition: service_healthy
    entrypoint: []
    command: ["python", "manage.py", "test"]
    volumes:
      - ./apps/api:/app
    tmpfs:
      - /data
    networks:
      - test-network

networks:
  test-network:
    internal: true
